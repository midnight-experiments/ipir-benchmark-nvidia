[package]
name = "simplepir-kernel"
version = "0.1.0-rc.4"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Backend-agnostic SimplePIR first-dimension kernels."
repository = "https://github.com/valargroup/ipir-sp"

[dependencies]
inspiring = { path = "../inspiring", version = "=0.1.0-rc.3" }
rayon = "1.10"
spiral-rs = { workspace = true }

[features]
default = []
cuda = ["dep:cudarc"]
# Patch 0004: which CUDA release cudarc's bindings are for is chosen here, one of the two with `cuda`. Upstream
# fixed 12.0, whose bindings load a symbol (nvrtcGetNVVM) that the NVRTC library of CUDA 13 no longer has.
cuda-12 = ["cuda", "cudarc/cuda-12000"]
cuda-13 = ["cuda", "cudarc/cuda-13000"]

[dependencies.cudarc]
version = "=0.17.3"
optional = true
default-features = false
features = ["std", "driver", "nvrtc", "dynamic-loading"]

[dev-dependencies]
criterion = "0.5"
rand_chacha = "0.3.1"

[[bench]]
name = "first_dim"
harness = false

[[example]]
name = "cuda_bench"
required-features = ["cuda"]
